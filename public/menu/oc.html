/* ============================================================================
   EL OYSTER CLUB · ESTILOS
   Diseño "carta digital": fondo azul cielo #8bb8e6, tinta #231f20,
   nombres condensados con el precio debajo, versalitas espaciadas (Cutive
   Mono) y alineaciones alternadas. Scroll continuo, como las páginas del
   PDF unidas. Mobile-first.
   ========================================================================== */

:root {
  --cielo:       #8bb8e6;   /* fondo azul de la carta */
  --cielo-claro: #9cc3ec;   /* variante para superficies sutiles */
  --tinta:       #231f20;   /* texto e ilustraciones */
  --tinta-suave: #3d3a3b;   /* descripciones largas */
  --linea:       #231f20;   /* líneas y marcos (misma tinta) */

  --display: "Oswald", "Arial Narrow", sans-serif;      /* condensada, mayúsculas */
  --mono:    "Cutive Mono", "Courier New", monospace;   /* versalitas espaciadas */
  --sans:    "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

  --ancho: 640px;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--cielo);
  color: var(--tinta);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  scroll-padding-top: 64px;
}

/* --- Portada (logo + MENÚ, como la primera página de la carta) ------- */
.cabecera {
  min-height: 86svh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 3rem 1.25rem 2rem;
}
.cabecera__inner { max-width: var(--ancho); }
.cabecera__logo { margin: 0; color: var(--tinta); }
.cabecera__logo-svg {
  width: min(64vw, 340px);
  height: auto;
  display: inline-block;
}
.cabecera__lema {
  font-family: var(--mono);
  font-size: 0.82rem;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  margin: 2.2rem 0 0;
}
.cabecera__costas {
  font-family: var(--mono);
  font-size: 0.66rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  opacity: 0.85;
  margin: 0.9rem 0 0;
}

/* --- Banners (caja delineada con título sobre el marco) --------------- */
.banners { max-width: var(--ancho); margin: 0 auto; padding: 0 1.25rem; }
.banner {
  position: relative;
  border: 2px solid var(--linea);
  border-radius: 18px;
  padding: 1.5rem 1rem 1.2rem;
  text-align: center;
  margin: 2.4rem 0 0;
}
.banner__titulo {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translate(-50%, -55%);
  background: var(--cielo);
  padding: 0 0.7rem;
  white-space: nowrap;
  font-family: var(--display);
  font-weight: 600;
  font-size: clamp(0.9rem, 4vw, 1.15rem);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.banner__texto {
  display: block;
  font-family: var(--mono);
  font-size: 0.8rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}

/* --- Navegación (anclas discretas, versalitas) ------------------------ */
.nav {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  gap: 1.2rem;
  justify-content: flex-start;
  overflow-x: auto;
  padding: 0.7rem 1.25rem;
  margin-top: 2rem;
  background: color-mix(in srgb, var(--cielo) 88%, transparent);
  backdrop-filter: blur(8px);
  border-top: 1px solid var(--linea);
  border-bottom: 1px solid var(--linea);
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.nav::-webkit-scrollbar { display: none; }
.nav__link {
  flex: 0 0 auto;
  font-family: var(--mono);
  font-size: 0.72rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--tinta);
  text-decoration: none;
  padding: 0.2rem 0;
  border-bottom: 2px solid transparent;
  white-space: nowrap;
}
.nav__link--activo { border-bottom-color: var(--tinta); }
.nav__link--proximamente { opacity: 0.55; }

/* --- Contenedor del menú --------------------------------------------- */
.menu { max-width: var(--ancho); margin: 0 auto; padding: 1rem 1.25rem 2rem; }

/* --- Secciones ------------------------------------------------------- */
.seccion { padding-top: 3.5rem; }
.seccion__head { margin-bottom: 2rem; text-align: center; }
.seccion__titulo {
  font-family: var(--display);
  font-weight: 600;
  font-size: clamp(1.6rem, 6.5vw, 2.1rem);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin: 0;
  line-height: 1.1;
}
.seccion__subtitulo {
  font-family: var(--mono);
  font-size: 0.76rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin: 0.8rem auto 0;
  max-width: 46ch;
  line-height: 1.7;
}
/* --- Sección destacada (especiales / brunch) -------------------------
   Tarjeta con DOBLE FILETE al estilo de las cartas clásicas: el contenido
   vive dentro de un paquete visual cerrado, separado del menú corrido.
   El filete interior es un ::before para no tocar el layout interno. */
.seccion--destacada {
  position: relative;
  margin: 3.2rem auto 1.2rem;
  padding: 2.4rem 1.4rem 2.1rem;
  border: 2px solid var(--tinta);
  border-radius: 20px;
  background: var(--cielo-claro);
}
.seccion--destacada::before {
  content: "";
  position: absolute;
  inset: 7px;
  border: 1px solid var(--tinta);
  border-radius: 14px;
  pointer-events: none;
}
.seccion--destacada .seccion__head { margin-bottom: 1.4rem; }
/* El título del especial se recorta sobre el filete superior, como sello */
.seccion--destacada .seccion__titulo { font-size: clamp(1.45rem, 6vw, 1.9rem); }
.seccion--destacada .grupo { margin-bottom: 0.4rem; }
/* Cierra el paquete: la nota final (la copa de espumoso) como pie del marco */
.seccion--destacada .grupo__cierre-nota {
  margin-top: 1rem;
  padding-top: 0.9rem;
  border-top: 1px solid var(--tinta);
}

.badge-proximamente {
  display: inline-block;
  margin-left: 0.75rem;
  vertical-align: middle;
  font-family: var(--mono);
  font-size: 0.66rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  border: 1px solid var(--linea);
  border-radius: 999px;
  padding: 0.2rem 0.7rem;
}

/* --- Grupos ----------------------------------------------------------- */
.grupo { margin-top: 3.2rem; }
.grupo:first-of-type { margin-top: 0; }

/* Etiqueta de familia (COCTELERÍA SIGNATURE, RON, VINOS...) */
.grupo__etiqueta {
  font-family: var(--mono);
  font-weight: 400;
  font-size: 0.78rem;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  margin: 0 0 2rem;
}

/* Título grande (LOS OYSTER SHOTS, CERVEZA, SIN ALCOHOL, CAFÉ...) */
.grupo__titulo {
  font-family: var(--display);
  font-weight: 600;
  font-size: clamp(1.45rem, 6vw, 1.9rem);
  letter-spacing: 0.05em;
  text-transform: uppercase;
  margin: 0 0 0.9rem;
  line-height: 1.15;
}

.titulo--centro { text-align: center; }
.titulo--izq    { text-align: left; }
.titulo--der    { text-align: right; }

.grupo__nota {
  font-size: 0.82rem;
  color: var(--tinta-suave);
  font-style: italic;
  margin: -0.4rem 0 1rem;
}
.grupo__nota--destacada {
  border-left: 3px solid var(--linea);
  padding: 0.6rem 0.8rem;
  font-style: normal;
}
.subgrupo__titulo {
  font-family: var(--mono);
  font-weight: 400;
  font-size: 0.72rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  margin: 1.6rem 0 0.5rem;
}

/* Alineaciones de grupo */
.grupo--der { text-align: right; }
.grupo--izq { text-align: left; }
.grupo--alt .item--display:nth-child(even) { text-align: right; }
.grupo--centrado { text-align: center; }

/* Cierre de grupo (nota + precio, estilo lista espaciada) */
.grupo__cierre { margin-top: 0.1rem; }
.grupo__cierre-nota,
.grupo__cierre-precio {
  font-family: var(--mono);
  font-size: 0.8rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  margin: 0 0 0.15rem;
  line-height: 1.8;
}

/* --- Ítems ------------------------------------------------------------ */
.items { list-style: none; margin: 0; padding: 0; }

/* Estilo "display": nombre grande + descripción + precio debajo -------- */
.item--display { margin-bottom: 2rem; }
.item--display:last-child { margin-bottom: 0; }
.display__nombre {
  display: block;
  font-family: var(--display);
  font-weight: 600;
  font-size: clamp(1.35rem, 5.6vw, 1.75rem);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  line-height: 1.15;
}
.display__desc {
  font-family: var(--mono);
  font-size: 0.76rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  line-height: 1.7;
  margin: 0.3rem 0 0;
}
.display__precio {
  display: block;
  font-family: var(--mono);
  font-size: 0.8rem;
  letter-spacing: 0.18em;
  margin-top: 0.35rem;
}

/* Estilo "leader": renglón compacto con línea corrida hasta el precio -- */
.item--leader {
  display: flex;
  align-items: baseline;
  gap: 0.15rem;
  padding: 0.28rem 0;
}
.leader__nombre {
  flex: 0 1 auto;
  font-family: var(--mono);
  font-size: 0.82rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  white-space: nowrap;
}
.leader__linea {
  flex: 1 1 auto;
  border-bottom: 1.5px solid var(--linea);
  transform: translateY(-4px);
  min-width: 1.5rem;
}
.leader__precio {
  flex: 0 0 auto;
  font-family: var(--mono);
  font-size: 0.82rem;
  letter-spacing: 0.12em;
  white-space: nowrap;
}

/* Estilo "lista": renglones espaciados sin precio ----------------------- */
.items--lista .item { border-bottom: none; padding: 0.16rem 0; }
.items--lista .item__nombre {
  font-family: var(--mono);
  font-size: 0.82rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--tinta);
  font-weight: 400;
}
.grupo--centrado .items--lista .item { text-align: center; }
.grupo--centrado .items--lista .item .item__head { justify-content: center; }
.grupo--izq .items--lista .item { text-align: left; }
.grupo--izq .items--lista .item .item__head { justify-content: flex-start; }

/* Renglón clásico (secciones de comida) --------------------------------- */
.item { padding: 0.75rem 0; }
.items:not(.items--lista) > .item:not(.item--display):not(.item--leader) {
  border-bottom: 1px dashed color-mix(in srgb, var(--tinta) 35%, transparent);
}
.items:not(.items--lista) > .item:last-child { border-bottom: none; }

.item__head { display: flex; align-items: baseline; gap: 0.35rem; }
.item__nombre-wrap { flex: 0 1 auto; min-width: 0; }
.item__nombre {
  font-family: var(--display);
  font-weight: 500;
  font-size: 1.08rem;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--tinta);
}
.item__detalle {
  display: inline-block;
  margin-left: 0.4rem;
  font-family: var(--mono);
  font-size: 0.62rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  white-space: nowrap;
}
.item__puntos {
  flex: 1 1 auto;
  border-bottom: 1px dotted color-mix(in srgb, var(--tinta) 55%, transparent);
  transform: translateY(-3px);
  min-width: 1rem;
}
.item__precio {
  flex: 0 0 auto;
  font-family: var(--mono);
  font-size: 0.85rem;
  letter-spacing: 0.1em;
  white-space: nowrap;
}

.item__desc {
  margin: 0.3rem 0 0;
  font-size: 0.88rem;
  color: var(--tinta-suave);
  line-height: 1.45;
  max-width: 60ch;
}
.item__pie {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.5rem;
  margin-top: 0.4rem;
}
.item__origen {
  font-family: var(--mono);
  font-size: 0.64rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

/* Ítems sin precio (carta impresa, centrados) --------------------------- */
.item--sinprecio { border-bottom: none !important; text-align: center; padding: 0.55rem 0; }
.item--sinprecio .item__head { justify-content: center; }
.item--sinprecio .item__puntos { display: none; }
.item--sinprecio .item__nombre { font-size: 1.3rem; letter-spacing: 0.07em; }
.item--sinprecio .item__desc { margin-left: auto; margin-right: auto; }
.item--sinprecio .item__pie { justify-content: center; }

/* --- Etiquetas (crudo / picante / etc.) -------------------------------- */
.etiquetas { display: flex; flex-wrap: wrap; gap: 0.35rem; }
.etiqueta {
  font-family: var(--mono);
  font-size: 0.6rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 0.12rem 0.5rem;
  border-radius: 999px;
  border: 1px solid var(--linea);
}

/* --- Add-ons ----------------------------------------------------------- */
.addons { margin-top: 0.5rem; }
.item--addon .item__nombre { font-size: 0.98rem; }

/* --- Pie de página (aviso legal + contraportada) ----------------------- */
.pie {
  text-align: center;
  padding: 4rem 1.25rem 0;
}
.pie__aviso {
  max-width: 52ch;
  margin: 0 auto;
  font-family: var(--mono);
  font-size: 0.64rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  line-height: 1.9;
}
.pie__contraportada {
  min-height: 55svh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2rem;
  color: var(--tinta);
}
.pie__contraportada img { width: min(52vw, 280px); height: auto; }
.pie__firma {
  font-family: var(--mono);
  font-size: 0.78rem;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  margin: 0;
}

/* --- Accesibilidad ----------------------------------------------------- */
.visualmente-oculto {
  position: absolute;
  width: 1px; height: 1px;
  margin: -1px; padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
}

/* --- Escritorio: columna angosta centrada, como la carta --------------- */
@media (min-width: 720px) {
  .menu { padding-top: 1.5rem; }
}

  </style>

  /* ---- Utilidades ---------------------------------------------------- */

  // Día actual (0=Dom..6=Sáb) y hora "HH:MM". Se puede forzar con
  // ?preview=sabado / ?preview=domingo o ?hora=14:30 para validar horarios.
  function contextoTemporal() {
    const ahora = new Date();
    let dia = ahora.getDay();
    let minutos = ahora.getHours() * 60 + ahora.getMinutes();

    const params = new URLSearchParams(window.location.search);
    const previewDia = params.get("preview");
    if (previewDia === "sabado") dia = 6;
    if (previewDia === "domingo") dia = 0;
    const previewHora = params.get("hora");
    if (previewHora && /^\d{1,2}:\d{2}$/.test(previewHora)) {
      const [h, m] = previewHora.split(":").map(Number);
      minutos = h * 60 + m;
    }
    return { dia, minutos };
  }

  function aMinutos(hhmm) {
    if (!hhmm) return null;
    const [h, m] = hhmm.split(":").map(Number);
    return h * 60 + m;
  }

  // Formatea el precio: número -> "$1,500"; cadena -> tal cual.
  function formatearPrecio(precio) {
    if (typeof precio === "number") {
      return "$" + precio.toLocaleString("es-MX");
    }
    return precio; // "Precio de mercado", "Según selección", etc.
  }

  // Línea de precio de un ítem, con copa si existe: "$1,100 • Copa $220".
  function lineaPrecio(item) {
    let linea = formatearPrecio(item.precio);
    if (item.precio_copa != null) {
      linea += " • " + tr("Copa") + " " + formatearPrecio(item.precio_copa);
    }
    return linea;
  }

  function formatearSobreprecio(valor) {
    if (typeof valor === "number") return "+$" + valor.toLocaleString("es-MX");
    return valor;
  }

  // Detalle de servicio: volumen y/o unidad (ml, pza, 100 g, copa...).
  function detalleServicio(item) {
    const partes = [];
    if (item.volumen_ml) partes.push(item.volumen_ml + " ml");
    if (item.unidad) partes.push(item.unidad);
    return partes.join(" · ");
  }

  function crear(tag, clase, texto) {
    const el = document.createElement(tag);
    if (clase) el.className = clase;
    if (texto != null) el.textContent = texto;
    return el;
  }

  /* ---- Reglas de visibilidad ---------------------------------------- */

  function seccionVisible(seccion, ctx) {
    if (seccion.estado === "oculto") return false;
    if (Array.isArray(seccion.dias_visibles) && seccion.dias_visibles.length) {
      if (!seccion.dias_visibles.includes(ctx.dia)) return false;
    }
    return true; // "activo" o "proximamente"
  }

  function itemVisible(item) {
    return item.estado !== "oculto";
  }

  function grupoVisible(grupo) {
    const propios = (grupo.items || []).filter(itemVisible).length > 0;
    const enSubgrupos = (grupo.subgrupos || []).some(
      (sg) => (sg.items || []).filter(itemVisible).length > 0
    );
    return propios || enSubgrupos || grupo.nota_pie != null;
  }

  function bannerVisible(banner, ctx) {
    if (banner.estado !== "activo") return false;
    if (Array.isArray(banner.dias) && banner.dias.length) {
      if (!banner.dias.includes(ctx.dia)) return false;
    }
    if (banner.siempre_visible) return true;
    const ini = aMinutos(banner.hora_inicio);
    const fin = aMinutos(banner.hora_fin);
    if (ini == null || fin == null) return true;
    return ctx.minutos >= ini && ctx.minutos < fin;
  }

  /* ---- Construcción de componentes ---------------------------------- */

  function renderEtiquetas(etiquetas) {
    const cont = crear("div", "etiquetas");
    (etiquetas || []).forEach((e) => {
      cont.appendChild(crear("span", "etiqueta etiqueta--" + e.replace(/\s+/g, "-"), e));
    });
    return cont;
  }

  // Estilo "display": nombre grande, descripción y precio debajo.
  function renderItemDisplay(item) {
    const li = crear("li", "item item--display");
    li.appendChild(crear("span", "display__nombre", tr(item.nombre)));
    if (item.descripcion) li.appendChild(crear("p", "display__desc", tr(item.descripcion)));
    if (item.precio != null) {
      const detalle = detalleServicio(item);
      li.appendChild(crear("span", "display__precio", lineaPrecio(item) + (detalle ? " · " + detalle : "")));
    }
    return li;
  }

  // Estilo "leader": renglón compacto con línea corrida hasta el precio.
  function renderItemLeader(item) {
    const li = crear("li", "item item--leader");
    const detalle = detalleServicio(item);
    li.appendChild(crear("span", "leader__nombre", tr(item.nombre) + (detalle ? " · " + detalle : "")));
    li.appendChild(crear("span", "leader__linea"));
    if (item.precio != null) li.appendChild(crear("span", "leader__precio", lineaPrecio(item)));
    return li;
  }

  // Renglón clásico: nombre + puntos + precio a la derecha (secciones de comida).
  function renderItemClasico(item) {
    const sinPrecio = item.precio == null;
    const li = crear("li", "item" + (sinPrecio ? " item--sinprecio" : ""));

    const encabezado = crear("div", "item__head");
    const nombreWrap = crear("div", "item__nombre-wrap");
    nombreWrap.appendChild(crear("span", "item__nombre", tr(item.nombre)));

    const detalle = detalleServicio(item);
    if (detalle) nombreWrap.appendChild(crear("span", "item__detalle", detalle));

    encabezado.appendChild(nombreWrap);

    if (!sinPrecio) {
      encabezado.appendChild(crear("span", "item__puntos"));
      encabezado.appendChild(crear("span", "item__precio", lineaPrecio(item)));
    }
    li.appendChild(encabezado);

    if (item.descripcion) {
      li.appendChild(crear("p", "item__desc", tr(item.descripcion)));
    }

    const pie = crear("div", "item__pie");
    if (item.origen) pie.appendChild(crear("span", "item__origen", item.origen));
    if (item.etiquetas && item.etiquetas.length) pie.appendChild(renderEtiquetas(item.etiquetas));
    if (pie.childNodes.length) li.appendChild(pie);

    return li;
  }

  function renderItem(item, estilo) {
    if (estilo === "display") return renderItemDisplay(item);
    if (estilo === "leader") return renderItemLeader(item);
    return renderItemClasico(item); // "lista" usa el clásico sin precio + CSS
  }

  function renderAddon(addon) {
    const li = crear("li", "item item--addon");

    const encabezado = crear("div", "item__head");
    const nombreWrap = crear("div", "item__nombre-wrap");
    nombreWrap.appendChild(crear("span", "item__nombre", tr(addon.nombre)));
    encabezado.appendChild(nombreWrap);
    encabezado.appendChild(crear("span", "item__puntos"));
    encabezado.appendChild(crear("span", "item__precio item__precio--addon", formatearSobreprecio(addon.sobreprecio)));
    li.appendChild(encabezado);

    if (addon.descripcion) li.appendChild(crear("p", "item__desc", tr(addon.descripcion)));

    const pie = crear("div", "item__pie");
    if (addon.origen) pie.appendChild(crear("span", "item__origen", addon.origen));
    if (addon.etiquetas && addon.etiquetas.length) pie.appendChild(renderEtiquetas(addon.etiquetas));
    if (pie.childNodes.length) li.appendChild(pie);

    return li;
  }

  function renderItems(items, estilo) {
    const clase = "items" + (estilo === "lista" ? " items--lista" : "");
    const ul = crear("ul", clase);
    items.filter(itemVisible).forEach((it) => ul.appendChild(renderItem(it, estilo)));
    return ul;
  }

  function claseAlineacion(alineacion) {
    if (alineacion === "derecha") return "grupo--der";
    if (alineacion === "alternada") return "grupo--alt";
    if (alineacion === "izquierda") return "grupo--izq";
    return "";
  }

  function claseAlineacionTitulo(grupo) {
    const a = grupo.alineacion_titulo || "centro";
    return "titulo--" + (a === "izquierda" ? "izq" : a === "derecha" ? "der" : "centro");
  }

  function renderGrupo(grupo) {
    const frag = document.createDocumentFragment();

    if (grupo.nombre) {
      const esEtiqueta = grupo.titulo_estilo === "etiqueta";
      const clase = (esEtiqueta ? "grupo__etiqueta" : "grupo__titulo") + " " + claseAlineacionTitulo(grupo);
      frag.appendChild(crear("h3", clase, tr(grupo.nombre)));
    }
    if (grupo.nota) frag.appendChild(crear("p", "grupo__nota", tr(grupo.nota)));

    if (Array.isArray(grupo.subgrupos) && grupo.subgrupos.length) {
      grupo.subgrupos.forEach((sg) => {
        frag.appendChild(crear("h4", "subgrupo__titulo", tr(sg.nombre)));
        frag.appendChild(renderItems(sg.items || [], grupo.estilo));
      });
    } else {
      frag.appendChild(renderItems(grupo.items || [], grupo.estilo));
    }

    // Cierre del grupo (p. ej. "Acompañados de tres piezas de ostion · $330").
    if (grupo.nota_pie || grupo.precio != null) {
      const cierre = crear("div", "grupo__cierre");
      if (grupo.nota_pie) cierre.appendChild(crear("p", "grupo__cierre-nota", tr(grupo.nota_pie)));
      if (grupo.precio != null) cierre.appendChild(crear("p", "grupo__cierre-precio", formatearPrecio(grupo.precio)));
      frag.appendChild(cierre);
    }
    return frag;
  }

  function renderAddons(addons) {
    const bloque = crear("div", "addons");
    bloque.appendChild(crear("h3", "grupo__titulo titulo--izq", tr(addons.titulo)));
    if (addons.nota) bloque.appendChild(crear("p", "grupo__nota grupo__nota--destacada", tr(addons.nota)));
    const ul = crear("ul", "items");
    (addons.items || []).filter(itemVisible).forEach((a) => ul.appendChild(renderAddon(a)));
    bloque.appendChild(ul);
    return bloque;
  }

  function renderSeccion(seccion) {
    const section = crear("section", "seccion" + (seccion.destacada ? " seccion--destacada" : ""));
    section.id = "sec-" + seccion.id;

    const head = crear("div", "seccion__head");
    const h2 = crear("h2", "seccion__titulo", tr(seccion.nombre));
    head.appendChild(h2);

    if (seccion.estado === "proximamente") {
      head.appendChild(crear("span", "badge-proximamente", tr("Próximamente")));
      section.appendChild(head);
      return section;
    }

    if (seccion.subtitulo) {
      head.appendChild(crear("p", "seccion__subtitulo", tr(seccion.subtitulo)));
    }
    section.appendChild(head);

    (seccion.grupos || []).filter(grupoVisible).forEach((g) => {
      const centrado = (g.estilo === "lista" && !g.alineacion) || g.centrado;
      const clases = ["grupo", claseAlineacion(g.alineacion), centrado ? "grupo--centrado" : ""]
        .filter(Boolean).join(" ");
      const wrap = crear("div", clases);
      wrap.appendChild(renderGrupo(g));
      section.appendChild(wrap);
    });

    if (seccion.addons) {
      const wrap = crear("div", "grupo");
      wrap.appendChild(renderAddons(seccion.addons));
      section.appendChild(wrap);
    }

    return section;
  }

  function renderNav(secciones) {
    const nav = document.getElementById("nav");
    nav.innerHTML = "";
    secciones.forEach((sec) => {
      const a = crear("a", "nav__link", tr(sec.nombre));
      a.href = "#sec-" + sec.id;
      if (sec.estado === "proximamente") a.classList.add("nav__link--proximamente");
      nav.appendChild(a);
    });
    activarScrollSpy(nav);
  }

  function activarScrollSpy(nav) {
    const enlaces = Array.from(nav.querySelectorAll(".nav__link"));
    const observador = new IntersectionObserver(
      (entradas) => {
        entradas.forEach((e) => {
          if (e.isIntersecting) {
            const id = e.target.id;
            enlaces.forEach((a) =>
              a.classList.toggle("nav__link--activo", a.getAttribute("href") === "#" + id)
            );
          }
        });
      },
      { rootMargin: "-45% 0px -50% 0px", threshold: 0 }
    );
    document.querySelectorAll(".seccion").forEach((s) => observador.observe(s));
  }

  /* ---- Cabecera, banners y pie -------------------------------------- */

  function renderCabecera(r) {
    // El logotipo (#marca) es una imagen estática; no se sobrescribe.
    document.getElementById("lema").textContent = tr(r.lema);
    document.getElementById("costas").textContent = r.costas.map(tr).join(" · ");
  }

  function renderBanners(banners, ctx) {
    const cont = document.getElementById("banners");
    cont.innerHTML = "";
    banners.filter((b) => bannerVisible(b, ctx)).forEach((b) => {
      const div = crear("div", "banner");
      div.appendChild(crear("span", "banner__titulo", tr(b.titulo)));
      div.appendChild(crear("span", "banner__texto", tr(b.texto)));
      cont.appendChild(div);
    });
  }

  function renderPie(r) {
    document.getElementById("aviso-legal").textContent = tr(r.aviso_legal);
  }

  /* ---- Arranque ------------------------------------------------------ */

  function init() {
    if (typeof MENU === "undefined") {
      console.error("No se encontró MENU (menu-data.js).");
      return;
    }
    const ctx = contextoTemporal();

    renderCabecera(MENU.restaurante);
    renderBanners(MENU.banners || [], ctx);

    const visibles = MENU.secciones.filter((s) => seccionVisible(s, ctx));
    renderNav(visibles);

    const main = document.getElementById("menu");
    main.innerHTML = "";
    visibles.forEach((s) => main.appendChild(renderSeccion(s)));

    renderPie(MENU.restaurante);

    // CTA fija y botón de idioma. El botón enseña el idioma AL QUE cambias.
    const cta = document.getElementById("cta-reservar");
    if (cta) cta.textContent = tr("Reservar mesa");
    const langBtn = document.getElementById("lang-toggle");
    if (langBtn) {
      langBtn.textContent = LANG === "en" ? "ES" : "EN";
      langBtn.title = LANG === "en" ? "Ver en español" : "View in English";
      langBtn.addEventListener("click", () => {
        localStorage.setItem("oc_lang", LANG === "en" ? "es" : "en");
        location.reload();
      });
    }
  }

  document.addEventListener("DOMContentLoaded", init);
})();

  </script>

<style>
  body { padding-bottom: 84px; }
  .cta-reservar {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: var(--tinta); color: var(--cielo); text-decoration: none;
    font-family: var(--display); font-size: 15px; letter-spacing: .14em;
    text-transform: uppercase; padding: 14px 30px; border-radius: 999px;
    border: 2px solid var(--tinta); box-shadow: 0 6px 18px rgba(35,31,32,.35);
    z-index: 50; white-space: nowrap;
  }
  .cta-reservar:active { background: var(--cielo); color: var(--tinta); }
  .lang-toggle {
    position: fixed; top: 12px; right: 12px; z-index: 60;
    width: 44px; height: 44px;
    background: var(--cielo); color: var(--tinta);
    border: 1.5px solid var(--tinta); border-radius: 50%;
    font-family: var(--mono, monospace); font-size: 13px; font-weight: 700;
    letter-spacing: .04em; cursor: pointer;
    box-shadow: 0 3px 10px rgba(35,31,32,.18);
    display: flex; align-items: center; justify-content: center;
  }
  .lang-toggle:active { background: var(--tinta); color: var(--cielo); }
</style>
<button id="lang-toggle" class="lang-toggle" type="button"></button>
<a id="cta-reservar" class="cta-reservar" href="/?reservar=OC">Reservar mesa</a>

</body>
</html>
